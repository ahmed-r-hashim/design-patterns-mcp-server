services:
  design-patterns-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: design-patterns-mcp
    ports:
      - 3006:3006
    env_file:
      - .env
    volumes:
      - design-patterns-data:/app/data
    restart: unless-stopped
volumes:
  design-patterns-data:
    driver: local
